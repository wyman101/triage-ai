[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "1.1.0"
description = "Multi-model code triage — run Claude, Gemini and Codex in parallel to analyze your codebase and merge their findings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "wyman101"}
]
keywords = [
    "code-review", "triage", "claude", "gemini", "codex", "openai", "anthropic", "google",
    "ai", "multi-model", "static-analysis", "security-audit", "code-quality",
    "mcp", "model-context-protocol", "cursor", "windsurf", "cline",
    "linter", "bug-detection", "consensus", "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rich>=13.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
triage = "triage_cli.__main__:main"

[project.urls]
Homepage = "https://github.com/wyman101/triage-ai"
Repository = "https://github.com/wyman101/triage-ai"
Issues = "https://github.com/wyman101/triage-ai/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["triage_cli*"]

[tool.pytest.ini_options]
testpaths = ["triage_cli/tests"]
python_files = ["test_*.py"]
